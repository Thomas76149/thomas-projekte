<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thomas.fun · Little Web Things</title>
  <meta name="description" content="Games, mini-apps and simulations — click and play, right in the browser." />
  <meta name="theme-color" content="#07060f" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/hub.css?v=21" />
</head>
<body>
  <div id="bg" aria-hidden="true">
    <canvas id="stars"></canvas>
    <div class="sun-glow"></div>
    <div class="sun"></div>
    <div class="floor"><div class="grid-plane"></div></div>
    <div class="horizon"></div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="wrap">
    <a class="topband" id="tband" href="#"></a>

    <header>
      <div class="hrow">
        <p class="logo">thomas<span>.fun</span> <span class="ball" id="logoBall" role="button" tabindex="0" title="Click me…" aria-label="Ball">⚽</span></p>
      </div>
      <p class="tagline">Little things to click — vanilla HTML, CSS &amp; JS.</p>
      <p class="subtag">Games, mini‑tools and tests, neatly sorted into departments. Pick one, click it, done.</p>
      <a class="back" href="#" data-portfolio-link>Portfolio</a>
    </header>

    <div class="toolbar" aria-label="Search & filter">
      <div class="search" role="search">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Search… (e.g. pong, wc, online, puzzle)" autocomplete="off" />
        <button class="chip" id="btnClear" type="button" aria-pressed="false">Reset</button>
      </div>
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-filter="game" aria-pressed="false">Games</button>
        <button class="chip" type="button" data-filter="online" aria-pressed="false">Online</button>
        <button class="chip" type="button" data-filter="puzzle" aria-pressed="false">Puzzle</button>
        <button class="chip" type="button" data-filter="data" aria-pressed="false">Data</button>
        <button class="chip" type="button" data-filter="test" aria-pressed="false">Tests</button>
        <button class="chip" type="button" data-filter="mobile" aria-pressed="false">Mobile</button>
      </div>
    </div>

    <p class="mutedLine" id="countLine">—</p>

    <main id="cats"></main>

    <footer>
      Team project: <a href="https://orbitex-demo.pages.dev" target="_blank" rel="noopener noreferrer">Orbitex</a>
      · <a href="#" data-portfolio-link>Portfolio</a>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <div class="takeover" id="takeover" aria-hidden="true">
    <div class="inner">
      <div class="big-emoji">🏆</div>
      <h1>Title</h1>
      <p>Subtitle</p>
      <button type="button">Close →</button>
    </div>
  </div>

  <script src="js/site-config.js?v=2"></script>
  <script src="js/portfolio-link.js?v=2"></script>
  <script src="js/hub-data.js?v=22"></script>
  <script src="js/hub.js?v=18"></script>
</body>
</html>
